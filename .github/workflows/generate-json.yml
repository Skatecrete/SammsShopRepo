name: Generate JSON from Images

on:
  push:
    paths:
      - 'public/images/flash/**'
      - 'public/images/portfolio/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate flash.json
        run: |
          echo '{"flash": [' > flash.json
          count=0
          for file in public/images/flash/*.jpg public/images/flash/*.jpeg public/images/flash/*.png public/images/flash/*.webp public/images/flash/*.gif; do
            if [ -f "$file" ]; then
              if [ $count -gt 0 ]; then
                echo ',' >> flash.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/flash/$filename\"}" >> flash.json
              count=$((count + 1))
            fi
          done
          echo ']}' >> flash.json

      - name: Generate portfolio.json
        run: |
          echo '{"portfolio": [' > portfolio.json
          count=0
          for file in public/images/portfolio/*.jpg public/images/portfolio/*.jpeg public/images/portfolio/*.png public/images/portfolio/*.webp public/images/portfolio/*.gif; do
            if [ -f "$file" ]; then
              if [ $count -gt 0 ]; then
                echo ',' >> portfolio.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/portfolio/$filename\"}" >> portfolio.json
              count=$((count + 1))
            fi
          done
          echo ']}' >> portfolio.json

      - name: Commit JSON files
        run: |
          git config user.name "GitHub Actions"
          git config.user.email "actions@github.com"
          git add flash.json portfolio.json
          git diff --staged --quiet || git commit -m "Auto-generate image JSON [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
