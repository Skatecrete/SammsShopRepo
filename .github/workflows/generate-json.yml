name: Generate JSON from Images

on:
  push:
    paths:
      - 'public/images/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: |
          git config pull.rebase false
          git pull origin main || true

      - name: Create directories
        run: |
          mkdir -p public/tattoo
          mkdir -p public/shop
          mkdir -p public/images/tattoo/flash
          mkdir -p public/images/tattoo/catalog
          mkdir -p public/images/tattoo/portfolio
          mkdir -p public/images/shop/home
          mkdir -p public/images/shop/jewelry
          mkdir -p public/images/shop/paintings
          mkdir -p public/images/shop/sculptures
          mkdir -p public/images/landing

      - name: Generate JSON files
        run: |
          # Function to generate JSON for a given section and category
          generate_json() {
            section=$1
            category=$2
            file="public/${section}/${category}.json"
            dir="public/images/${section}/${category}"
            
            echo "{\"${category}\": [" > "$file"
            count=0
            for img in "$dir"/*.jpg "$dir"/*.jpeg "$dir"/*.png "$dir"/*.webp "$dir"/*.gif; do
              if [ -f "$img" ]; then
                if [ $count -gt 0 ]; then
                  echo ',' >> "$file"
                fi
                filename=$(basename "$img")
                echo "{\"image\": \"/images/${section}/${category}/${filename}\"}" >> "$file"
                count=$((count + 1))
              fi
            done
            echo ']}' >> "$file"
            echo "Generated $file with $count images"
          }

          # Tattoo sections
          generate_json "tattoo" "flash"
          generate_json "tattoo" "catalog"
          generate_json "tattoo" "portfolio"

          # Shop sections
          generate_json "shop" "home"
          generate_json "shop" "jewelry"
          generate_json "shop" "paintings"
          generate_json "shop" "sculptures"

      - name: Commit JSON files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/tattoo/*.json public/shop/*.json
          git diff --staged --quiet || git commit -m "Auto-generate image JSON [skip ci]"
          git pull origin main --rebase || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
