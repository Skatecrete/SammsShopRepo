name: Generate JSON from Images

on:
  push:
    paths:
      - 'public/images/flash/**'
      - 'public/images/portfolio/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate flash.json
        run: |
          echo "{\"flash\": [" > flash.json
          first=true
          for file in public/images/flash/*.{jpg,jpeg,png,webp,gif} 2>/dev/null; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> flash.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/flash/$filename\"}" >> flash.json
            fi
          done
          echo "]}" >> flash.json

      - name: Generate portfolio.json
        run: |
          echo "{\"portfolio\": [" > portfolio.json
          first=true
          for file in public/images/portfolio/*.{jpg,jpeg,png,webp,gif} 2>/dev/null; do
            if [ -f "$file" ]; then
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> portfolio.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/portfolio/$filename\"}" >> portfolio.json
            fi
          done
          echo "]}" >> portfolio.json

      - name: Commit JSON files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add flash.json portfolio.json
          git diff --staged --quiet || git commit -m "Auto-generate image JSON [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
