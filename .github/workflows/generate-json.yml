name: Generate JSON from Images

on:
  push:
    paths:
      - 'public/images/flash/**'
      - 'public/images/catalog/**'
      - 'public/images/portfolio/**'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate flash.json
        run: |
          echo '{"flash": [' > public/flash.json
          count=0
          for file in public/images/flash/*.jpg public/images/flash/*.jpeg public/images/flash/*.png public/images/flash/*.webp public/images/flash/*.gif; do
            if [ -f "$file" ]; then
              if [ $count -gt 0 ]; then
                echo ',' >> public/flash.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/flash/$filename\"}" >> public/flash.json
              count=$((count + 1))
            fi
          done
          echo ']}' >> public/flash.json
          echo "Generated flash.json with $count images"

      - name: Generate catalog.json
        run: |
          echo '{"catalog": [' > public/catalog.json
          count=0
          for file in public/images/catalog/*.jpg public/images/catalog/*.jpeg public/images/catalog/*.png public/images/catalog/*.webp public/images/catalog/*.gif; do
            if [ -f "$file" ]; then
              if [ $count -gt 0 ]; then
                echo ',' >> public/catalog.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/catalog/$filename\"}" >> public/catalog.json
              count=$((count + 1))
            fi
          done
          echo ']}' >> public/catalog.json
          echo "Generated catalog.json with $count images"

      - name: Generate portfolio.json
        run: |
          echo '{"portfolio": [' > public/portfolio.json
          count=0
          for file in public/images/portfolio/*.jpg public/images/portfolio/*.jpeg public/images/portfolio/*.png public/images/portfolio/*.webp public/images/portfolio/*.gif; do
            if [ -f "$file" ]; then
              if [ $count -gt 0 ]; then
                echo ',' >> public/portfolio.json
              fi
              filename=$(basename "$file")
              echo "{\"image\": \"/images/portfolio/$filename\"}" >> public/portfolio.json
              count=$((count + 1))
            fi
          done
          echo ']}' >> public/portfolio.json
          echo "Generated portfolio.json with $count images"

      - name: Commit JSON files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add public/flash.json public/catalog.json public/portfolio.json
          git diff --staged --quiet || git commit -m "Auto-generate image JSON [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}