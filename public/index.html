<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkinPrints and Piercings</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- LANDING PAGE (NO HEADER) -->
    <div id="landing-page">
        <!-- Title -->
        <div class="landing-title-section">
            <h1 class="landing-main-title">SkinPrints and Piercings</h1>
            <p class="landing-sub-title">by</p>
            <p class="landing-sub-title">Samm (@GutterMuttx)</p>
        </div>

        <!-- Tattoo Slideshow -->
        <div class="landing-slideshow">
            <div class="slideshow-container" id="landing-slideshow">
                <div class="slideshow-track" id="landing-slideshow-track"></div>
            </div>
        </div>

        <!-- Tattoo Button -->
        <a href="/tattoo.html" class="landing-btn">
            <img src="/images/landing/tattoo_logo.png" alt="Tattoo" class="landing-btn-icon" onerror="this.style.display='none'">
            <span class="landing-btn-text">Tattoo</span>
        </a>

        <!-- Shop Slideshow -->
        <div class="landing-slideshow">
            <div class="slideshow-container" id="landing-shop-slideshow">
                <div class="slideshow-track" id="landing-shop-slideshow-track"></div>
            </div>
        </div>

        <!-- Shop Button -->
        <a href="/shop.html" class="landing-btn">
            <img src="/images/landing/shop_logo.png" alt="Shop" class="landing-btn-icon" onerror="this.style.display='none'">
            <span class="landing-btn-text">Shop</span>
        </a>
    </div>

    <script src="app.js"></script>
</body>
</html>
