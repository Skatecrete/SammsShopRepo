<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - SkinPrints and Piercings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f3f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem 8rem 1rem;
        }
        .login-container {
            background: #fff;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }
        .login-container h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
        }
        .login-container p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .login-container input {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        .login-container input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        .login-container button {
            width: 100%;
            padding: 0.8rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-container button:hover { background: #333; }
        .login-container .error {
            color: #dc3545;
            font-size: 0.9rem;
            margin-top: 1rem;
            display: none;
        }
        .login-container .error.show { display: block; }
        .login-container .back-link {
            display: block;
            margin-top: 1.5rem;
            color: #999;
            font-size: 0.8rem;
            text-decoration: none;
        }
        .login-container .back-link:hover { color: #666; }
        @media (max-width: 600px) {
            .login-container { padding: 2rem; }
            body { padding-bottom: 7rem; }
        }
        @media (max-width: 400px) {
            body { padding-bottom: 6rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Admin</h1>
        <p>Enter your credentials to access the admin panel</p>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required autofocus>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
            <div class="error" id="error-msg">Invalid username or password.</div>
        </form>
        <a href="/" class="back-link">← Back to site</a>
    </div>

    <script>
        const ADMIN_USER = 'Samm';
        const ADMIN_PASS = '0510';

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (username === ADMIN_USER && password === ADMIN_PASS) {
                localStorage.setItem('admin', 'true');
                window.location.href = '/admin-dashboard.html';
            } else {
                errorMsg.classList.add('show');
                setTimeout(function() { errorMsg.classList.remove('show'); }, 3000);
            }
        });
    </script>
</body>
</html>
