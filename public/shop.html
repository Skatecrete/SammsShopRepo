<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - SkinPrints and Piercings</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .shop-bg-logo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            max-width: 500px;
            pointer-events: none;
            z-index: 0;
        }
        #shop-content {
            position: relative;
            z-index: 1;
        }
        .content-wrapper {
            position: relative;
            z-index: 1;
            padding: 2rem 1rem 8rem 1rem;
            min-height: 80vh;
        }
        .header-logo-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 1rem;
        }
        .header-logo {
            max-height: 50px;
            width: auto;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-tabs-wrapper {
            flex: 2;
            min-width: 200px;
        }
        .nav-right-logo {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .nav-right-logo img {
            max-height: 55px;
            width: auto;
        }
    </style>
</head>
<body>
    <nav id="main-nav">
        <div class="nav-container">
            <div class="nav-left">
                <span id="header-title">SkinPrints &amp; Piercings by Samm (@GutterMuttx)</span>
            </div>
            <div class="nav-tabs nav-tabs-shop nav-tabs-wrapper">
                <div class="nav-row">
                    <a href="/" class="tab-btn home-btn">Home</a>
                    <button class="tab-btn active" data-tab="shop-paintings">Paintings</button>
                    <button class="tab-btn" data-tab="shop-jewelry">Jewelry</button>
                    <button class="tab-btn" data-tab="shop-sculptures">Sculptures</button>
                </div>
            </div>
            <div class="nav-right-logo">
                <img src="/images/landing/shop_logo.png" alt="Shop Logo" class="header-logo">
            </div>
        </div>
    </nav>

    <img src="/images/landing/shop_logo.png" alt="Shop Logo" class="shop-bg-logo">

    <main id="shop-content">
        <div class="content-wrapper">
            <section id="shop-paintings" class="tab-content active">
                <h2>Paintings</h2>
                <div class="shop-grid" id="shop-paintings-grid"><p class="loading">Loading paintings...</p></div>
            </section>
            <section id="shop-jewelry" class="tab-content">
                <h2>Jewelry</h2>
                <div class="shop-grid" id="shop-jewelry-grid"><p class="loading">Loading jewelry...</p></div>
            </section>
            <section id="shop-sculptures" class="tab-content">
                <h2>Sculptures</h2>
                <div class="shop-grid" id="shop-sculptures-grid"><p class="loading">Loading sculptures...</p></div>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 SkinPrints and Piercings</p>
        <a href="/admin.html" class="admin-link-btn">Admin</a>
    </footer>

    <div id="fullscreen-overlay" style="display:none;">
        <button id="fullscreen-close">✕</button>
        <img id="fullscreen-image" src="" alt="Fullscreen view">
    </div>

    <script src="app.js"></script>
</body>
</html>
