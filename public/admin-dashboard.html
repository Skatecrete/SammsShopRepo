<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkinPrints and Piercings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container { max-width: 1000px; margin: 0 auto; padding: 2rem 1rem; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ddd;
        }
        .admin-header h1 { font-size: 2rem; }
        .admin-header .logout-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .admin-header .logout-btn:hover { background: #c82333; }
        .upload-section {
            background: #f8f8f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .upload-section h3 { margin-bottom: 1rem; }
        .upload-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .upload-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-btn.flash { background: #28a745; }
        .upload-btn.flash:hover { background: #218838; }
        .upload-btn.catalog { background: #6f42c1; }
        .upload-btn.catalog:hover { background: #5a32a3; }
        .upload-btn.portfolio { background: #007bff; }
        .upload-btn.portfolio:hover { background: #0069d9; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .upload-status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            display: none;
        }
        .upload-status.success { display: block; background: #d4edda; color: #155724; }
        .upload-status.error { display: block; background: #f8d7da; color: #721c24; }
        .image-section { margin-bottom: 2rem; }
        .image-section h3 { margin-bottom: 0.5rem; }
        .image-section .count { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
        .image-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        .image-item-admin {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #ddd;
        }
        .image-item-admin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-item-admin .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220,53,69,0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-item-admin .delete-btn:hover { background: #c82333; }
        .image-item-admin .filename {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 0.3rem;
            font-size: 0.7rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .action-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #ddd;
        }
        .action-section .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-section .btn.regenerate { background: #ffc107; color: #212529; }
        .action-section .btn.regenerate:hover { background: #e0a800; }
        .action-section .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .action-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
        }
        .action-status.success { background: #d4edda; color: #155724; }
        .action-status.error { background: #f8d7da; color: #721c24; }
        .file-input-hidden { display: none; }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .status-badge.ready { background: #d4edda; color: #155724; }
        .status-badge.error { background: #f8d7da; color: #721c24; }
        .status-badge.loading { background: #fff3cd; color: #856404; }
        @media (max-width: 600px) {
            .admin-header h1 { font-size: 1.5rem; }
            .upload-buttons { flex-direction: column; }
            .upload-btn { text-align: center; }
            .image-grid-admin { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="status-container">
            <span id="status-badge" class="status-badge ready">✅ Ready</span>
        </div>

        <div class="upload-section">
            <h3>📤 Upload Images</h3>
            <div class="upload-buttons">
                <button class="upload-btn flash" onclick="triggerUpload('flash')">Upload to Flash</button>
                <button class="upload-btn catalog" onclick="triggerUpload('catalog')">Upload to Catalog</button>
                <button class="upload-btn portfolio" onclick="triggerUpload('portfolio')">Upload to Portfolio</button>
            </div>
            <input type="file" id="file-input" class="file-input-hidden" multiple accept="image/*">
            <div id="upload-status" class="upload-status"></div>
        </div>

        <div class="image-section">
            <h3>🎨 Flash Images</h3>
            <p class="count" id="flash-count">0 images</p>
            <div class="image-grid-admin" id="flash-admin-grid"><p>Loading...</p></div>
        </div>

        <div class="image-section">
            <h3>📚 Catalog Images</h3>
            <p class="count" id="catalog-count">0 images</p>
            <div class="image-grid-admin" id="catalog-admin-grid"><p>Loading...</p></div>
        </div>

        <div class="image-section">
            <h3>🖼️ Portfolio Images</h3>
            <p class="count" id="portfolio-count">0 images</p>
            <div class="image-grid-admin" id="portfolio-admin-grid"><p>Loading...</p></div>
        </div>

        <div class="action-section">
            <button class="btn regenerate" id="regenerate-btn" onclick="triggerWorkflow()">🔄 Regenerate JSON</button>
            <div id="action-status" class="action-status" style="display:none;"></div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - No token in code!
        // ============================================
        const REPO_OWNER = 'Skatecrete';
        const REPO_NAME = 'SammsShopRepo';

        // ============================================
        // AUTH CHECK
        // ============================================

        (function checkAuth() {
            if (localStorage.getItem('admin') !== 'true') {
                window.location.href = '/admin.html';
            }
        })();

        // ============================================
        // GET TOKEN FROM NETLIFY ENV VAR
        // ============================================

        async function getGitHubToken() {
            try {
                const response = await fetch('/.netlify/functions/get-token');
                if (!response.ok) {
                    throw new Error('Failed to get token');
                }
                const data = await response.json();
                return data.token;
            } catch (error) {
                console.error('Error fetching token:', error);
                setStatus('❌ ' + error.message, 'error');
                return null;
            }
        }

        // ============================================
        // DOM REFS
        // ============================================

        const fileInput = document.getElementById('file-input');
        const uploadStatus = document.getElementById('upload-status');
        const flashAdminGrid = document.getElementById('flash-admin-grid');
        const catalogAdminGrid = document.getElementById('catalog-admin-grid');
        const portfolioAdminGrid = document.getElementById('portfolio-admin-grid');
        const flashCount = document.getElementById('flash-count');
        const catalogCount = document.getElementById('catalog-count');
        const portfolioCount = document.getElementById('portfolio-count');
        const actionStatus = document.getElementById('action-status');
        const statusBadge = document.getElementById('status-badge');
        const regenerateBtn = document.getElementById('regenerate-btn');

        let currentCategory = '';
        let isProcessing = false;

        // ============================================
        // STATUS BADGE
        // ============================================

        function setStatus(text, type) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge ' + type;
        }

        // ============================================
        // UPLOAD IMAGES
        // ============================================

        function triggerUpload(category) {
            currentCategory = category;
            fileInput.click();
        }

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;

            const category = currentCategory;
            const btn = document.querySelector(`.upload-btn.${category}`);
            btn.disabled = true;
            showStatus('upload', 'Uploading...', '');
            setStatus('⏳ Uploading...', 'loading');

            const token = await getGitHubToken();
            if (!token) {
                showStatus('upload', '❌ Failed to get token', 'error');
                setStatus('❌ Token error', 'error');
                btn.disabled = false;
                fileInput.value = '';
                return;
            }

            let successCount = 0;
            for (const file of files) {
                try {
                    await uploadFile(category, file, token);
                    successCount++;
                } catch (error) {
                    console.error('Upload failed:', error);
                }
            }

            if (successCount > 0) {
                showStatus('upload', `✅ ${successCount} image(s) uploaded!`, 'success');
                setStatus('✅ Upload complete', 'ready');
                loadAdminImages();
                await triggerWorkflow();
            } else {
                showStatus('upload', '❌ Upload failed. Check console.', 'error');
                setStatus('❌ Upload failed', 'error');
            }

            btn.disabled = false;
            fileInput.value = '';
        });

        async function uploadFile(category, file, token) {
            const path = `public/images/${category}/${file.name}`;
            const reader = new FileReader();
            const base64 = await new Promise((resolve) => {
                reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Add ${category} image: ${file.name}`,
                    content: base64,
                    branch: 'main'
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Upload failed');
            }

            return await response.json();
        }

        // ============================================
        // DELETE IMAGE
        // ============================================

        async function deleteImage(category, filename) {
            if (!confirm(`Delete "${filename}"?`)) return;

            const token = await getGitHubToken();
            if (!token) { alert('Failed to get token'); return; }

            const path = `public/images/${category}/${filename}`;

            try {
                const shaResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!shaResponse.ok) throw new Error('File not found');
                const shaData = await shaResponse.json();

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete ${category} image: ${filename}`,
                        sha: shaData.sha,
                        branch: 'main'
                    })
                });

                if (!response.ok) throw new Error('Delete failed');

                loadAdminImages();
                await triggerWorkflow();
            } catch (error) {
                alert(`Failed to delete: ${error.message}`);
            }
        }

        // ============================================
        // LOAD ADMIN IMAGES (FROM JSON FILES)
        // ============================================

        async function loadAdminImages() {
            await Promise.all([
                loadCategoryImages('flash', flashAdminGrid, flashCount),
                loadCategoryImages('catalog', catalogAdminGrid, catalogCount),
                loadCategoryImages('portfolio', portfolioAdminGrid, portfolioCount)
            ]);
        }

        async function loadCategoryImages(category, container, countElement) {
            try {
                const jsonFile = category === 'flash' ? '/flash.json' : 
                                category === 'catalog' ? '/catalog.json' : '/portfolio.json';
                const response = await fetch(jsonFile);

                if (!response.ok) {
                    container.innerHTML = '<p>No images yet. Upload some!</p>';
                    countElement.textContent = '0 images';
                    return;
                }

                const data = await response.json();
                const images = data[category] || [];

                if (images.length === 0) {
                    container.innerHTML = '<p>No images yet. Upload some!</p>';
                    countElement.textContent = '0 images';
                    return;
                }

                container.innerHTML = images.map(item => {
                    const imagePath = item.image || item;
                    const filename = imagePath.split('/').pop();
                    return `
                        <div class="image-item-admin">
                            <img src="${imagePath}" alt="${filename}" onerror="this.style.display='none'">
                            <button class="delete-btn" onclick="deleteImage('${category}', '${filename}')">✕</button>
                            <div class="filename">${filename}</div>
                        </div>
                    `;
                }).join('');

                countElement.textContent = `${images.length} images`;
            } catch (error) {
                console.error(`Error loading ${category}:`, error);
                container.innerHTML = '<p>Error loading images.</p>';
            }
        }

        // ============================================
        // TRIGGER WORKFLOW
        // ============================================

        async function triggerWorkflow() {
            if (isProcessing) return;
            isProcessing = true;
            regenerateBtn.disabled = true;

            showStatus('action', '⏳ Triggering workflow...', '');
            setStatus('⏳ Triggering workflow...', 'loading');

            const token = await getGitHubToken();
            if (!token) {
                showStatus('action', '❌ Failed to get token', 'error');
                setStatus('❌ Token error', 'error');
                isProcessing = false;
                regenerateBtn.disabled = false;
                return;
            }

            try {
                const workflowsRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!workflowsRes.ok) {
                    const errorData = await workflowsRes.text();
                    throw new Error(`GitHub API error: ${workflowsRes.status} - ${errorData}`);
                }

                const workflowsData = await workflowsRes.json();
                const workflow = workflowsData.workflows?.find(w => w.name === 'Generate JSON from Images');

                if (!workflow) {
                    throw new Error('Workflow "Generate JSON from Images" not found');
                }

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${workflow.id}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                if (response.status === 204) {
                    showStatus('action', '✅ Workflow triggered successfully! Site updates in ~2 min.', 'success');
                    setStatus('✅ Workflow triggered', 'ready');
                } else {
                    const errorText = await response.text();
                    throw new Error(`GitHub API error: ${response.status} - ${errorText}`);
                }
            } catch (error) {
                console.error('Workflow error:', error);
                showStatus('action', `❌ Error: ${error.message}`, 'error');
                setStatus('❌ ' + error.message, 'error');
            }

            isProcessing = false;
            regenerateBtn.disabled = false;
        }

        // ============================================
        // SHOW STATUS
        // ============================================

        function showStatus(type, message, className) {
            const element = type === 'upload' ? uploadStatus : actionStatus;
            element.textContent = message;
            element.className = className || '';
            element.style.display = message ? 'block' : 'none';
        }

        // ============================================
        // LOGOUT
        // ============================================

        function logout() {
            localStorage.removeItem('admin');
            window.location.href = '/';
        }

        // ============================================
        // INIT
        // ============================================

        setStatus('✅ Ready', 'ready');
        loadAdminImages();
        setInterval(loadAdminImages, 30000);

        window.triggerUpload = triggerUpload;
        window.deleteImage = deleteImage;
        window.triggerWorkflow = triggerWorkflow;
        window.logout = logout;
    </script>
</body>
</html>
