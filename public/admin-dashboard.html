<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkinPrints and Piercings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem 8rem 1rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ddd;
        }
        .admin-header h1 { font-size: 2rem; }
        .admin-header .logout-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .admin-header .logout-btn:hover { background: #c82333; }

        .tab-selector {
            background: #f8f8f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 2px solid #ddd;
        }
        .tab-selector label {
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .tab-selector select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background: #fff;
            cursor: pointer;
        }
        .tab-selector select:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .upload-section {
            background: #f8f8f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 2px dashed #ccc;
            display: none;
        }
        .upload-section.visible { display: block; }
        .upload-section h3 { margin-bottom: 1rem; color: #333; }
        .upload-section .upload-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 0.95rem;
        }
        .upload-section .upload-btn.upload-images {
            background: #28a745;
        }
        .upload-section .upload-btn.upload-images:hover { background: #218838; }
        .upload-section .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .shop-item-form {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }
        .shop-item-form input {
            padding: 0.6rem 1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
            flex: 1;
            min-width: 150px;
        }
        .shop-item-form input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .image-section { margin-bottom: 2rem; }
        .image-section h3 { margin-bottom: 0.5rem; }
        .image-section .count { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
        .image-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        .image-item-admin {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #ddd;
        }
        .image-item-admin .image-wrapper {
            aspect-ratio: 1 / 1;
            overflow: hidden;
        }
        .image-item-admin .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-item-admin .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220,53,69,0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-item-admin .delete-btn:hover { background: #c82333; }
        .image-item-admin .item-details {
            padding: 0.5rem 0.8rem;
            background: #fff;
        }
        .image-item-admin .item-details input {
            width: 100%;
            padding: 0.3rem 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
        }
        .image-item-admin .item-details input:focus {
            outline: none;
            border-color: #1a1a1a;
        }
        .image-item-admin .item-details .current-title {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 0.2rem;
        }
        .image-item-admin .item-details .current-price {
            font-size: 0.75rem;
            color: #a64d79;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .price-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fff;
            margin-bottom: 0.3rem;
        }
        .price-input-wrapper .price-currency {
            padding: 0.3rem 0 0.3rem 0.5rem;
            font-size: 0.85rem;
            color: #666;
            font-weight: 600;
        }
        .price-input-wrapper input {
            border: none !important;
            padding: 0.3rem 0.5rem !important;
            margin: 0 !important;
            flex: 1;
            min-width: 0;
        }
        .price-input-wrapper input:focus {
            outline: none;
        }

        .save-changes-section {
            background: #f8f8f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            border: 2px solid #ddd;
            display: none;
            text-align: center;
        }
        .save-changes-section.visible { display: block; }
        .save-changes-section .save-btn {
            padding: 0.8rem 3rem;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .save-changes-section .save-btn:hover { background: #218838; }
        .save-changes-section .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .save-changes-section .save-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }

        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .status-badge.ready { background: #d4edda; color: #155724; }
        .status-badge.error { background: #f8d7da; color: #721c24; }
        .status-badge.loading { background: #fff3cd; color: #856404; }

        .upload-status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            display: none;
        }
        .upload-status.success { display: block; background: #d4edda; color: #155724; }
        .upload-status.error { display: block; background: #f8d7da; color: #721c24; }

        .file-input-hidden { display: none; }

        @media (max-width: 600px) {
            .admin-header h1 { font-size: 1.5rem; }
            .image-grid-admin { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .shop-item-form { flex-direction: column; }
            .save-changes-section .save-btn { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div id="status-container">
            <span id="status-badge" class="status-badge ready">✅ Ready</span>
        </div>

        <div class="tab-selector">
            <label for="tab-select">Select a tab to begin edit:</label>
            <select id="tab-select">
                <option value="">— Select a tab —</option>
                <optgroup label="Tattoo">
                    <option value="tattoo-flash">Tattoo → Flash</option>
                    <option value="tattoo-catalog">Tattoo → Catalog</option>
                    <option value="tattoo-portfolio">Tattoo → Portfolio</option>
                </optgroup>
                <optgroup label="Shop">
                    <option value="shop-paintings">Shop → Paintings</option>
                    <option value="shop-jewelry">Shop → Jewelry</option>
                    <option value="shop-sculptures">Shop → Sculptures</option>
                </optgroup>
            </select>
        </div>

        <div id="upload-section" class="upload-section">
            <h3 id="upload-title">Upload Images</h3>
            
            <div id="shop-item-form" class="shop-item-form" style="display:none;">
                <input type="text" id="shop-item-title" placeholder="Item title...">
                <input type="text" id="shop-item-price" placeholder="Price (e.g. 45.00)...">
            </div>
            
            <div class="upload-buttons">
                <button class="upload-btn upload-images" id="upload-btn" onclick="triggerUpload()">+ Upload Images</button>
            </div>
            <input type="file" id="file-input" class="file-input-hidden" multiple accept="image/*">
            <div id="upload-status" class="upload-status"></div>
        </div>

        <!-- SAVE CHANGES SECTION -->
        <div id="save-changes-section" class="save-changes-section">
            <button class="save-btn" id="save-changes-btn" onclick="saveAllChanges()">💾 Save All Changes</button>
            <div class="save-status" id="save-status"></div>
        </div>

        <div class="image-section">
            <h3 id="grid-title">Images</h3>
            <p class="count" id="image-count">0 images</p>
            <div class="image-grid-admin" id="image-admin-grid"><p>Select a tab to begin.</p></div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'Skatecrete';
        const REPO_NAME = 'SammsShopRepo';

        let currentTab = '';
        let currentCategory = '';
        let currentSection = '';
        let isShop = false;

        (function checkAuth() {
            if (localStorage.getItem('admin') !== 'true') {
                window.location.href = '/admin.html';
            }
        })();

        async function getGitHubToken() {
            try {
                const response = await fetch('/.netlify/functions/get-token');
                if (!response.ok) throw new Error('Failed to get token');
                const data = await response.json();
                return data.token;
            } catch (error) {
                console.error('Error fetching token:', error);
                setStatus('❌ ' + error.message, 'error');
                return null;
            }
        }

        const tabSelect = document.getElementById('tab-select');
        const uploadSection = document.getElementById('upload-section');
        const uploadTitle = document.getElementById('upload-title');
        const gridTitle = document.getElementById('grid-title');
        const imageCount = document.getElementById('image-count');
        const imageGrid = document.getElementById('image-admin-grid');
        const uploadStatus = document.getElementById('upload-status');
        const statusBadge = document.getElementById('status-badge');
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const shopItemForm = document.getElementById('shop-item-form');
        const shopItemTitle = document.getElementById('shop-item-title');
        const shopItemPrice = document.getElementById('shop-item-price');
        const saveSection = document.getElementById('save-changes-section');
        const saveBtn = document.getElementById('save-changes-btn');
        const saveStatus = document.getElementById('save-status');

        let pendingChanges = [];

        function setStatus(text, type) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge ' + type;
        }

        function showStatus(message, className) {
            uploadStatus.textContent = message;
            uploadStatus.className = className || '';
            uploadStatus.style.display = message ? 'block' : 'none';
        }

        function showSaveStatus(message, isSuccess) {
            saveStatus.textContent = message;
            saveStatus.style.color = isSuccess ? '#28a745' : '#dc3545';
        }

        tabSelect.addEventListener('change', function() {
            const value = this.value;
            if (!value) {
                uploadSection.classList.remove('visible');
                saveSection.classList.remove('visible');
                imageGrid.innerHTML = '<p>Select a tab to begin.</p>';
                imageCount.textContent = '0 images';
                return;
            }

            const parts = value.split('-');
            currentSection = parts[0];
            currentCategory = parts[1];
            isShop = currentSection === 'shop';

            uploadSection.classList.add('visible');
            saveSection.classList.add('visible');
            uploadTitle.textContent = isShop ? `Upload to Shop → ${capitalize(currentCategory)}` : `Upload to Tattoo → ${capitalize(currentCategory)}`;
            gridTitle.textContent = isShop ? `Shop → ${capitalize(currentCategory)}` : `Tattoo → ${capitalize(currentCategory)}`;

            shopItemForm.style.display = isShop ? 'flex' : 'none';

            currentTab = value;
            pendingChanges = [];
            loadImages();
        });

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        function markChange() {
            pendingChanges.push(Date.now());
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 Save All Changes';
            showSaveStatus('Changes pending...', false);
        }

        async function loadImages() {
            if (!currentTab) return;
            imageGrid.innerHTML = '<p>Loading...</p>';

            try {
                const jsonFile = `/${currentSection}/${currentCategory}.json`;
                const response = await fetch(jsonFile);

                if (!response.ok) {
                    imageGrid.innerHTML = '<p>No images yet. Upload some!</p>';
                    imageCount.textContent = '0 images';
                    return;
                }

                const data = await response.json();
                const items = data[currentCategory] || [];

                if (items.length === 0) {
                    imageGrid.innerHTML = '<p>No images yet. Upload some!</p>';
                    imageCount.textContent = '0 images';
                    return;
                }

                let html = '';
                items.forEach((item, index) => {
                    const imagePath = item.image || item;
                    const filename = imagePath.split('/').pop();
                    const title = item.title || '';
                    const price = item.price || '';

                    html += `
                        <div class="image-item-admin" data-index="${index}" data-filename="${filename}">
                            <div class="image-wrapper">
                                <img src="${imagePath}" alt="${filename}" onerror="this.style.display='none'">
                                <button class="delete-btn" onclick="deleteImage('${currentTab}', '${filename}')">✕</button>
                            </div>
                            <div class="item-details">
                                ${isShop ? `
                                    <div class="current-title">Title: ${title || '(none)'}</div>
                                    <div class="current-price">Price: ${price ? '$' + price : '(none)'}</div>
                                    <input type="text" class="shop-title-input" value="${title}" placeholder="Item title..." data-filename="${filename}" onchange="markChange()">
                                    <div class="price-input-wrapper">
                                        <span class="price-currency">$</span>
                                        <input type="text" class="shop-price-input" value="${price ? '$' + price : ''}" placeholder="$0.00" data-filename="${filename}" onchange="markChange()">
                                    </div>
                                ` : `
                                    <div style="font-size:0.75rem; color:#666; padding:0.3rem;">${filename}</div>
                                `}
                            </div>
                        </div>
                    `;
                });

                imageGrid.innerHTML = html;
                imageCount.textContent = `${items.length} images`;
                saveBtn.disabled = true;
                saveBtn.textContent = '💾 Save All Changes';
                showSaveStatus('No changes to save', false);

            } catch (error) {
                console.error('Error loading images:', error);
                imageGrid.innerHTML = '<p>Error loading images.</p>';
            }
        }

        async function saveAllChanges() {
            if (!currentTab || !isShop) {
                showSaveStatus('Nothing to save for this tab.', false);
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ Saving...';
            showSaveStatus('Saving changes...', false);

            const [section, category] = currentTab.split('-');
            const jsonPath = `public/${section}/${category}.json`;
            const token = await getGitHubToken();
            if (!token) {
                showSaveStatus('Failed to get token.', false);
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save All Changes';
                return;
            }

            try {
                // Get current data from all input fields
                const items = [];
                const containers = document.querySelectorAll('.image-item-admin');
                
                containers.forEach(container => {
                    const filename = container.dataset.filename;
                    const titleInput = container.querySelector('.shop-title-input');
                    const priceInput = container.querySelector('.shop-price-input');
                    
                    if (titleInput && priceInput) {
                        const title = titleInput.value.trim();
                        let price = priceInput.value.trim().replace(/^\$/, '');
                        items.push({
                            image: `/images/${section}/${category}/${filename}`,
                            title: title,
                            price: price
                        });
                    }
                });

                if (items.length === 0) {
                    showSaveStatus('No items to save.', false);
                    saveBtn.disabled = false;
                    saveBtn.textContent = '💾 Save All Changes';
                    return;
                }

                const newContent = JSON.stringify({ [category]: items }, null, 2);

                // Get current file SHA
                const jsonResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${jsonPath}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                let sha = null;
                if (jsonResponse.ok) {
                    const jsonData = await jsonResponse.json();
                    sha = jsonData.sha;
                }

                // Update the JSON file
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${jsonPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Update ${category} items`,
                        content: btoa(newContent),
                        sha: sha,
                        branch: 'main'
                    })
                });

                if (!response.ok) throw new Error('Failed to save changes');

                showSaveStatus('✅ All changes saved successfully!', true);
                pendingChanges = [];
                saveBtn.disabled = true;
                saveBtn.textContent = '✅ Saved!';
                setTimeout(() => {
                    saveBtn.textContent = '💾 Save All Changes';
                }, 2000);

                await loadImages();
                await triggerWorkflow();

            } catch (error) {
                console.error('Save error:', error);
                showSaveStatus('❌ Failed to save: ' + error.message, false);
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save All Changes';
            }
        }

        function triggerUpload() {
            if (!currentTab) {
                alert('Please select a tab first.');
                return;
            }
            fileInput.click();
        }

        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;

            const title = document.getElementById('shop-item-title')?.value?.trim() || '';
            const price = document.getElementById('shop-item-price')?.value?.trim() || '';

            uploadBtn.disabled = true;
            showStatus('Uploading...', '');
            setStatus('⏳ Uploading...', 'loading');

            const token = await getGitHubToken();
            if (!token) {
                showStatus('❌ Failed to get token', 'error');
                setStatus('❌ Token error', 'error');
                uploadBtn.disabled = false;
                fileInput.value = '';
                return;
            }

            let successCount = 0;
            for (const file of files) {
                try {
                    await uploadFile(currentTab, file, token);
                    successCount++;
                } catch (error) {
                    console.error('Upload failed:', error);
                }
            }

            if (successCount > 0) {
                if (isShop && (title || price)) {
                    await saveAllShopItems(files, title, price);
                }
                showStatus(`✅ ${successCount} image(s) uploaded!`, 'success');
                setStatus('✅ Upload complete', 'ready');
                await loadImages();
                await triggerWorkflow();
            } else {
                showStatus('❌ Upload failed. Please try again.', 'error');
                setStatus('❌ Upload failed', 'error');
            }

            uploadBtn.disabled = false;
            fileInput.value = '';
            if (document.getElementById('shop-item-title')) {
                document.getElementById('shop-item-title').value = '';
                document.getElementById('shop-item-price').value = '';
            }
        });

        async function uploadFile(tab, file, token) {
            const [section, category] = tab.split('-');
            const path = `public/images/${section}/${category}/${file.name}`;

            const reader = new FileReader();
            const base64 = await new Promise((resolve) => {
                reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                reader.readAsDataURL(file);
            });

            const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `Add ${category} image: ${file.name}`,
                    content: base64,
                    branch: 'main'
                })
            });

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || 'Upload failed');
            }

            return await response.json();
        }

        async function saveAllShopItems(files, title, price) {
            const [section, category] = currentTab.split('-');
            const jsonPath = `public/${section}/${category}.json`;
            const token = await getGitHubToken();
            if (!token) return;

            try {
                const jsonResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${jsonPath}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                let items = [];
                let sha = null;

                if (jsonResponse.ok) {
                    const jsonData = await jsonResponse.json();
                    sha = jsonData.sha;
                    const content = atob(jsonData.content);
                    const parsed = JSON.parse(content);
                    items = parsed[category] || [];
                }

                for (const file of files) {
                    const filename = file.name;
                    const exists = items.some(item => {
                        const itemFilename = item.image ? item.image.split('/').pop() : item;
                        return itemFilename === filename;
                    });
                    if (!exists) {
                        items.push({
                            image: `/images/${section}/${category}/${filename}`,
                            title: title,
                            price: price
                        });
                    }
                }

                const newContent = JSON.stringify({ [category]: items }, null, 2);

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${jsonPath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Add shop items to ${category}`,
                        content: btoa(newContent),
                        sha: sha,
                        branch: 'main'
                    })
                });

                if (!response.ok) throw new Error('Failed to save shop items');

            } catch (error) {
                console.error('Save shop items error:', error);
            }
        }

        async function deleteImage(tab, filename) {
            if (!confirm(`Delete "${filename}"?`)) return;

            const [section, category] = tab.split('-');
            const token = await getGitHubToken();
            if (!token) { alert('Failed to get token'); return; }

            const path = `public/images/${section}/${category}/${filename}`;

            try {
                const shaResponse = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!shaResponse.ok) throw new Error('File not found');
                const shaData = await shaResponse.json();

                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Delete ${category} image: ${filename}`,
                        sha: shaData.sha,
                        branch: 'main'
                    })
                });

                if (!response.ok) throw new Error('Delete failed');

                await loadImages();
                await triggerWorkflow();
            } catch (error) {
                alert(`Failed to delete: ${error.message}`);
            }
        }

        async function triggerWorkflow() {
            const token = await getGitHubToken();
            if (!token) return;

            try {
                const workflowsRes = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (!workflowsRes.ok) throw new Error('Failed to list workflows');

                const workflowsData = await workflowsRes.json();
                const workflow = workflowsData.workflows?.find(w => w.name === 'Generate JSON from Images');

                if (!workflow) throw new Error('Workflow not found');

                await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/actions/workflows/${workflow.id}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ ref: 'main' })
                });

                console.log('✅ Workflow triggered');

            } catch (error) {
                console.error('Workflow error:', error);
            }
        }

        function logout() {
            localStorage.removeItem('admin');
            window.location.href = '/';
        }

        setStatus('✅ Ready', 'ready');
        imageGrid.innerHTML = '<p>Select a tab to begin.</p>';

        window.triggerUpload = triggerUpload;
        window.deleteImage = deleteImage;
        window.saveAllChanges = saveAllChanges;
        window.markChange = markChange;
        window.logout = logout;
    </script>
</body>
</html>
