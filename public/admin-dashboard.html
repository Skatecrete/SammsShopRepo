<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkinPrints and Piercings</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #ddd;
        }
        .admin-header h1 { font-size: 2rem; }
        .admin-header .logout-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .admin-header .logout-btn:hover { background: #c82333; }
        .upload-section {
            background: #f8f8f8;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        .upload-section h3 { margin-bottom: 1rem; }
        .upload-buttons { display: flex; gap: 1rem; flex-wrap: wrap; }
        .upload-btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 6px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .upload-btn.flash { background: #28a745; }
        .upload-btn.flash:hover { background: #218838; }
        .upload-btn.portfolio { background: #007bff; }
        .upload-btn.portfolio:hover { background: #0069d9; }
        .upload-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .upload-status {
            margin-top: 1rem;
            padding: 0.8rem;
            border-radius: 6px;
            display: none;
        }
        .upload-status.success { display: block; background: #d4edda; color: #155724; }
        .upload-status.error { display: block; background: #f8d7da; color: #721c24; }
        .image-section { margin-bottom: 2rem; }
        .image-section h3 { margin-bottom: 0.5rem; }
        .image-section .count { color: #666; font-size: 0.9rem; margin-bottom: 1rem; }
        .image-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        .image-item-admin {
            position: relative;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #ddd;
        }
        .image-item-admin img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .image-item-admin .delete-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220,53,69,0.9);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .image-item-admin .delete-btn:hover { background: #c82333; }
        .image-item-admin .filename {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 0.3rem;
            font-size: 0.7rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .action-section {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 2px solid #ddd;
        }
        .action-section .btn {
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        .action-section .btn.regenerate { background: #ffc107; color: #212529; }
        .action-section .btn.regenerate:hover { background: #e0a800; }
        .action-status {
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
        }
        .action-status.success { background: #d4edda; color: #155724; }
        .action-status.error { background: #f8d7da; color: #721c24; }
        .file-input-hidden { display: none; }
        @media (max-width: 600px) {
            .admin-header h1 { font-size: 1.5rem; }
            .upload-buttons { flex-direction: column; }
            .upload-btn { text-align: center; }
            .image-grid-admin { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 Admin Panel</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
        <div class="upload-section">
            <h3>📤 Upload Images</h3>
            <div class="upload-buttons">
                <button class="upload-btn flash" onclick="triggerUpload('flash')">Upload to Flash</button>
                <button class="upload-btn portfolio" onclick="triggerUpload('portfolio')">Upload to Portfolio</button>
            </div>
            <input type="file" id="file-input" class="file-input-hidden" multiple accept="image/*">
            <div id="upload-status" class="upload-status"></div>
        </div>
        <div class="image-section">
            <h3>🎨 Flash Images</h3>
            <p class="count" id="flash-count">0 images</p>
            <div class="image-grid-admin" id="flash-admin-grid"><p>Loading...</p></div>
        </div>
        <div class="image-section">
            <h3>🖼️ Portfolio Images</h3>
            <p class="count" id="portfolio-count">0 images</p>
            <div class="image-grid-admin" id="portfolio-admin-grid"><p>Loading...</p></div>
        </div>
        <div class="action-section">
            <button class="btn regenerate" onclick="triggerWorkflow()">🔄 Regenerate JSON</button>
            <div id="action-status" class="action-status" style="display:none;"></div>
        </div>
    </div>
    <script>
        const CONFIG = {
            GITHUB: { owner: 'Skatecrete', repo: 'SamsmShopRepo' }
        };
        
        (function checkAuth() {
            if (localStorage.getItem('admin') !== 'true') {
                window.location.href = '/admin.html';
            }
        })();
        
        let currentCategory = '';
        const fileInput = document.getElementById('file-input');
        const uploadStatus = document.getElementById('upload-status');
        const flashAdminGrid = document.getElementById('flash-admin-grid');
        const portfolioAdminGrid = document.getElementById('portfolio-admin-grid');
        const flashCount = document.getElementById('flash-count');
        const portfolioCount = document.getElementById('portfolio-count');
        const actionStatus = document.getElementById('action-status');
        
        function triggerUpload(category) {
            currentCategory = category;
            fileInput.click();
        }
        
        fileInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (!files.length) return;
            const category = currentCategory;
            const btn = document.querySelector(`.upload-btn.${category}`);
            btn.disabled = true;
            showStatus('upload', 'Uploading...', '');
            let successCount = 0;
            for (const file of files) {
                try {
                    await uploadFile(category, file);
                    successCount++;
                } catch (error) { console.error('Upload failed:', error); }
            }
            if (successCount > 0) {
                showStatus('upload', `✅ ${successCount} image(s) uploaded!`, 'success');
                loadAdminImages();
                await triggerWorkflow();
            }
            btn.disabled = false;
            fileInput.value = '';
        });
        
        async function uploadFile(category, file) {
            const token = await getGitHubToken();
            const path = `public/images/${category}/${file.name}`;
            const reader = new FileReader();
            const base64 = await new Promise((resolve) => {
                reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                reader.readAsDataURL(file);
            });
            const response = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB.owner}/${CONFIG.GITHUB.repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Add ${category} image: ${file.name}`, content: base64, branch: 'main' })
            });
            if (!response.ok) throw new Error('Upload failed');
            return await response.json();
        }
        
        async function deleteImage(category, filename) {
            if (!confirm(`Delete "${filename}"?`)) return;
            const token = await getGitHubToken();
            const path = `public/images/${category}/${filename}`;
            try {
                const shaResponse = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB.owner}/${CONFIG.GITHUB.repo}/contents/${path}`);
                if (!shaResponse.ok) throw new Error('File not found');
                const shaData = await shaResponse.json();
                const response = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB.owner}/${CONFIG.GITHUB.repo}/contents/${path}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `Delete ${category} image: ${filename}`, sha: shaData.sha, branch: 'main' })
                });
                if (!response.ok) throw new Error('Delete failed');
                loadAdminImages();
                await triggerWorkflow();
            } catch (error) {
                alert(`Failed to delete: ${error.message}`);
            }
        }
        
        async function getGitHubToken() {
            const response = await fetch('/.netlify/functions/get-token');
            if (response.ok) { const data = await response.json(); return data.token; }
            return prompt('Enter GitHub Personal Access Token:');
        }
        
        async function loadAdminImages() {
            await Promise.all([
                loadCategoryImages('flash', flashAdminGrid, flashCount),
                loadCategoryImages('portfolio', portfolioAdminGrid, portfolioCount)
            ]);
        }
        
        async function loadCategoryImages(category, container, countElement) {
            try {
                const jsonFile = category === 'flash' ? '/flash.json' : '/portfolio.json';
                const response = await fetch(jsonFile);
                if (!response.ok) throw new Error('Failed to load');
                const data = await response.json();
                const images = data[category] || [];
                if (images.length === 0) {
                    container.innerHTML = '<p>No images yet.</p>';
                    countElement.textContent = '0 images';
                    return;
                }
                container.innerHTML = images.map(item => {
                    const imagePath = item.image || item;
                    const filename = imagePath.split('/').pop();
                    return `<div class="image-item-admin">
                        <img src="${imagePath}" alt="${filename}">
                        <button class="delete-btn" onclick="deleteImage('${category}', '${filename}')">✕</button>
                        <div class="filename">${filename}</div>
                    </div>`;
                }).join('');
                countElement.textContent = `${images.length} images`;
            } catch (error) {
                container.innerHTML = '<p>Error loading images.</p>';
            }
        }
        
        async function triggerWorkflow() {
            showStatus('action', '⏳ Triggering workflow...', '');
            const token = await getGitHubToken();
            try {
                const response = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB.owner}/${CONFIG.GITHUB.repo}/actions/workflows/generate-json.yml/dispatches`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ref: 'main' })
                });
                if (response.ok) {
                    showStatus('action', '✅ Workflow triggered! Site updates in ~2 min.', 'success');
                } else {
                    showStatus('action', '❌ Failed to trigger workflow.', 'error');
                }
            } catch (error) {
                showStatus('action', `❌ Error: ${error.message}`, 'error');
            }
        }
        
        function showStatus(type, message, className) {
            const element = type === 'upload' ? uploadStatus : actionStatus;
            element.textContent = message;
            element.className = className || '';
            element.style.display = message ? 'block' : 'none';
        }
        
        function logout() {
            localStorage.removeItem('admin');
            window.location.href = '/';
        }
        
        loadAdminImages();
        setInterval(loadAdminImages, 30000);
        window.triggerUpload = triggerUpload;
        window.deleteImage = deleteImage;
        window.triggerWorkflow = triggerWorkflow;
        window.logout = logout;
    </script>
</body>
</html>
